<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة بنيان الحاسوب الشاملة</title>
    <!-- Importing your data file here! -->
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --text-main: #333333;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        /* --- SETUP SCREEN STYLES --- */
        #setup-screen {
            text-align: center;
            padding: 20px;
        }
        select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border-radius: 10px;
            border: 2px solid var(--accent);
            margin: 20px 0;
            font-family: inherit;
        }

        /* --- QUIZ UI STYLES --- */
        #quiz-screen { display: none; }
        
        .progress-bar-container {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question-box { margin-bottom: 25px; }

        .module-badge {
            display: inline-block;
            background-color: #e8f4f8;
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stem {
            background-color: #f8f9fa;
            padding: 15px;
            border-right: 4px solid var(--accent);
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1.05em;
            line-height: 1.6;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background-color: #f0f8ff;
            transform: translateX(-5px);
        }

        .option-letter {
            flex-shrink: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #eef3f8;
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9em;
        }

        .option-text {
            flex: 1;
            text-align: right;
        }

        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option-btn.correct .option-letter {
            background-color: rgba(255,255,255,0.3);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .option-btn.wrong .option-letter {
            background-color: rgba(255,255,255,0.3);
            color: white;
        }

        .explanation {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f6f3;
            border-radius: 10px;
            border: 1px solid #b2e0d3;
            animation: fadeIn 0.5s;
        }

        .explanation h4 { margin-top: 0; color: #16a085; }
        .explanation .errors {
            margin-top: 15px;
            color: #c0392b;
            font-size: 0.95em;
        }

        .action-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #2980b9; }
        
        #next-btn { display: none; }
        #results-screen { display: none; text-align: center; }
        .score-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 3em; font-weight: bold;
            margin: 0 auto 20px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>بنك أسئلة بنيان الحاسوب</h1>
        </header>

        <!-- Setup Screen: Select what to study -->
        <div id="setup-screen">
            <h2>اختر المحاضرة :</h2>
            <select id="module-selector">
                <option value="all">مراجعة شاملة (جميع الأسئلة)</option>
                <!-- Options will be injected here via JS -->
            </select>
            <button class="action-btn" onclick="startQuiz()">ابدأ المراجعة ➔</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen">
            <div class="stats">
                <span id="question-counter">السؤال 1 من 10</span>
                <span id="score-counter">النقاط: 0</span>
            </div>
            
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="question-box">
                <div class="module-badge" id="q-module-badge">المحاضرة</div>
                <div class="stem" id="q-stem"></div>
                <div class="question-text" id="q-text"></div>
                
                <div class="options" id="options-container">
                    <!-- Options injected here -->
                </div>
            </div>

            <div class="explanation" id="explanation-box">
                <h4>التحليل والاشتقاق:</h4>
                <p id="exp-derivation"></p>
                <div class="errors">
                    <strong>الأخطاء الشائعة: </strong> <span id="exp-errors"></span>
                </div>
            </div>

            <button class="action-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ➔</button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen">
            <h2>انتهى الاختبار!</h2>
            <div class="score-circle" id="final-score"></div>
            <p>لقد أتممت المراجعة بنجاح.</p>
            <button class="action-btn" style="margin-top: 30px;" onclick="location.reload()">العودة للقائمة الرئيسية ↻</button>
        </div>
    </div>

    <script>
        let currentExamData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Map A, B, C, D back to array indexes for checking correct answers
        const letterToIndex = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
        const indexToLetter = ['A', 'B', 'C', 'D'];

        // Initialize: Populate the dropdown from data.js
        window.onload = function() {
            const selector = document.getElementById('module-selector');
            
            // 'modules' variable comes directly from data.js
            modules.forEach((mod, index) => {
                const option = document.createElement('option');
                option.value = index;
                // Show title and number of questions
                option.text = `${mod.title} (${mod.questions.length} أسئلة)`;
                selector.appendChild(option);
            });

            checkCorrectAnswerBalance();
        };

        // Since options are always shown in fixed A->B->C->D order (see loadQuestion),
        // the anti-gaming protection depends entirely on data.js varying which letter
        // is correct across questions. This dev-only console check flags any module
        // where one letter dominates too heavily, so a lopsided question set (e.g.
        // "correct" almost always "A") gets caught early instead of silently shipping.
        function checkCorrectAnswerBalance() {
            modules.forEach((mod) => {
                const counts = { A: 0, B: 0, C: 0, D: 0 };
                mod.questions.forEach((q) => {
                    if (counts.hasOwnProperty(q.correct)) counts[q.correct]++;
                });
                const total = mod.questions.length;
                if (total === 0) return;
                const maxShare = Math.max(...Object.values(counts)) / total;
                if (maxShare > 0.5) {
                    console.warn(
                        `[Answer-balance check] "${mod.title}": one letter makes up ` +
                        `${Math.round(maxShare * 100)}% of correct answers ${JSON.stringify(counts)}. ` +
                        `Consider varying "correct" more across this module's questions.`
                    );
                }
            });
        }

        // Called when user clicks "Start"
        function startQuiz() {
            const selector = document.getElementById('module-selector');
            const selectedValue = selector.value;
            currentExamData = []; // Clear current queue

            if (selectedValue === 'all') {
                // Flatten all questions from all modules into one array
                modules.forEach(mod => {
                    mod.questions.forEach(q => {
                        currentExamData.push({...q, moduleTitle: mod.title});
                    });
                });
            } else {
                // Get only questions from the selected module
                const selectedModule = modules[selectedValue];
                selectedModule.questions.forEach(q => {
                    currentExamData.push({...q, moduleTitle: selectedModule.title});
                });
            }

            // Shuffle the QUESTION order so it's not the same order every time
            currentExamData.sort(() => Math.random() - 0.5);

            // Hide setup, show quiz
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const q = currentExamData[currentQuestionIndex];
            
            document.getElementById('q-module-badge').innerText = q.moduleTitle + " | " + q.title;
            document.getElementById('question-counter').innerText = `السؤال ${currentQuestionIndex + 1} من ${currentExamData.length}`;
            document.getElementById('score-counter').innerText = `النقاط: ${score}`;
            
            // Update Progress bar
            const progress = ((currentQuestionIndex) / currentExamData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            document.getElementById('q-stem').innerText = q.stem;
            document.getElementById('q-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // NOTE ON ANTI-GAMING STRATEGY:
            // Options are always rendered in fixed A -> B -> C -> D order, top to
            // bottom, every single time. We deliberately do NOT shuffle the visual
            // position of the options, because scrambling them (so "A" might appear
            // last) makes the quiz confusing to read and breaks the natural mapping
            // between the on-screen order and the explanation text below.
            //
            // Instead, the fix lives in the DATA: data.js is written so the
            // "correct" letter is deliberately varied across questions (not always
            // "A"), so a student clicking the same visual slot every time will not
            // score well. This keeps the UI simple and readable while still
            // preventing position-based guessing. See the bottom of this file for
            // a console self-check that flags any module where this balance drifts.
            q.choices.forEach((choiceText, originalIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.originalIndex = originalIndex;

                const letterSpan = document.createElement('span');
                letterSpan.className = 'option-letter';
                letterSpan.innerText = indexToLetter[originalIndex];

                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = choiceText;

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);
                btn.onclick = () => checkAnswer(originalIndex, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selectedOriginalIndex, btnElement) {
            if (answered) return;
            answered = true;

            const q = currentExamData[currentQuestionIndex];
            const correctIndex = letterToIndex[q.correct]; // always the ORIGINAL index, unaffected by display shuffle
            const allButtons = document.querySelectorAll('.option-btn');

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedOriginalIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
                document.getElementById('score-counter').innerText = `النقاط: ${score}`;
            } else {
                btnElement.classList.add('wrong');
                // Find whichever button currently displays the correct original index
                // (its screen position varies question to question due to the shuffle)
                const correctBtn = document.querySelector(`.option-btn[data-original-index="${correctIndex}"]`);
                if (correctBtn) correctBtn.classList.add('correct');
            }

            document.getElementById('exp-derivation').innerText = q.derivation;
            document.getElementById('exp-errors').innerText = q.errors;
            document.getElementById('explanation-box').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentExamData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            
            const finalScoreElem = document.getElementById('final-score');
            finalScoreElem.innerText = `${score} / ${currentExamData.length}`;
            document.getElementById('progress-bar').style.width = `100%`;
        }
    </script>
</body>
</html>
